; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f091rc]
platform = ststm32
board = nucleo_f091rc
framework = cmsis
; Pin toolchain to a version with a linux_aarch64 build (e.g. Raspberry Pi 5);
; ststm32's default range (>=1.60301.0,<1.80000.0) has no aarch64 Linux package.
; 1.120301.0 is already listed as an official optionalVersions fallback upstream.
platform_packages = platformio/toolchain-gccarmnoneeabi@1.120301.0
upload_command = openocd -f openocd.cfg -c "program .pio/build/nucleo_f091rc/firmware.elf verify reset exit"
debug_server = 
    ${platformio.packages_dir}/tool-openocd/bin/openocd
    -f
    openocd.cfg
build_src_flags = -DSTM32F091
build_flags = -Wl,-u_printf_float
extra_scripts = pre:link_autotest.py
upload_protocol = stlink
debug_init_break = tbreak main
board_build.f_cpu = 48000000L
monitor_speed = 115200
monitor_eol = LF
